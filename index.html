<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lionel Greene</title>

  <style>
    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: "Times New Roman", Times, serif;
      font-size: 17px;
      line-height: 1.5;
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 72px 40px 96px 40px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: bold;
      letter-spacing: 0;
    }

    .description {
      margin: 0 0 56px 0;
      font-style: italic;
    }

    h2 {
      margin: 0 0 18px 0;
      font-size: 17px;
      line-height: 1.4;
      font-weight: bold;
    }

    .year {
      margin-bottom: 42px;
    }

    .entry {
      margin: 0 0 8px 0;
    }

    a {
      color: #111111;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      main {
        padding: 48px 24px 72px 24px;
      }

      body {
        font-size: 17px;
      }

      .description {
        margin-bottom: 44px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>LIONEL GREENE</h1>

    <p class="description">
      Selected writings on capital, institutions, technology, judgment, and stewardship.
    </p>

    <section class="year">
      <h2>2026</h2>

      <p class="entry">
        September 3 — The Cost of Abundant Intelligence
      </p>
    </section>
  </main>
</body>
</html>
